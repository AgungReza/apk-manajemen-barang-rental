name: Deploy ke Railway

on:
  push:
    branches: [main]    # Otomatis saat push ke main
  workflow_dispatch:    # Dapat dijalankan manual

jobs:
  deploy_railway:
    name: Deploy ke Railway
    runs-on: ubuntu-latest

    steps:
      - name: 🔄 Checkout Source Code
        uses: actions/checkout@v3

      - name: 🛠 Install Railway CLI
        run: npm install -g railway

      - name: 🔐 Login Railway (via token)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway login --token $RAILWAY_TOKEN

      - name: 🚀 Deploy ke Railway
        run: |
          echo "🚀 Deploying ke Railway pada: $(date)"
          railway up

      - name: 🧪 Verifikasi Deploy
        run: echo "✅ Berhasil deploy ke Railway!"
